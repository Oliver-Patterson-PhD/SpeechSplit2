[tox]
no_package = true
pip_pre = true
min_version = 4.9.0
requires =
    setuptools
    tox-ignore-env-name-mismatch~=0.2.0
    tox>=4

[testenv:{run,mypy,reports}]
env_dir = {toxworkdir}{/}static
runner = ignore_env_name_mismatch
deps =
	mypy
    inflect
    librosa
    matplotlib
    more-itertools
    numba
    numpy<2
    pillow
    pysptk
    pyworld
    safetensors
    scipy
    setuptools-rust
    standard-imghdr
    tensorboard
    tiktoken
    torch
    torchaudio
    tqdm
    triton>=2.0.0,<3;platform_machine=="x86_64" and sys_platform=="linux" or sys_platform=="linux2"
    types-requests
    unidecode
    wavenet_vocoder
    {[testenv:tensorboard]deps}
pass_env = PIP_INDEX_URL, PIP_EXTRA_INDEX_URL
description =
	run: Run the program
	mypy: Run mypy type checks
	reports: Generate type-checking reports
commands =
    run: python -m . {posargs}
    mypy: mypy -p .
    reports: mypy -p . --html-report artefacts/mypy
	tensorboard: tensorboard --logdir artefacts/tensorboard #--samples_per_plugin='scalars=1600000'
