[options]
experiment = "trainmask"
run_tests = ["train"]
dataset_name = "vctk"
num_iters = 6400000
resume_iters = 2800000
log_step = 10000
ckpt_save_step = 10000
train = true
return_latents = false
regenerate_data = false

[dataloader]
shuffle = true
batch_size = 64
num_workers = 20
samplier = 64
drop_and_pad = false

[training]
mask_loss = true
lr = 0.001
beta1 = 0.9
beta2 = 0.999
