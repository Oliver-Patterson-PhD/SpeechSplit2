[options]
experiment = "trainswitch"
run_tests = ["train"]
dataset_name = "vctk"
num_iters = 6400000
log_step = 10000
ckpt_save_step = 10000
train = true
return_latents = false
regenerate_data = false

[dataloader]
shuffle = true
batch_size = 128
num_workers = 24
samplier = 8
drop_and_pad = false

[training]
mask_loss = true
lr = 0.001
beta1 = 0.9
beta2 = 0.999
