[project]
name = "phd"
version = "0.1.0"
description = "Fork of SpeechSplit2 for my PhD project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cement",
    "disvoice",
    "inflect",
    "kaldi-io",
    "librosa",
    "matplotlib",
    "more-itertools",
    "numba",
    "numpy",
    "pillow",
    "praat-parselmouth",
    "pysptk",
    "pyworld",
    "requests",
    "safetensors",
    "scipy",
    "setuptools-rust",
    "speech-intelligibility-index",
    "standard-imghdr",
    "tensorboard",
    "torchmetrics",
    "torchmetrics[audio]",
    "torchmetrics[detection]",
    "torchmetrics[image]",
    "torchmetrics[text]",
    "tqdm",
    "triton",
    "types-requests",
    "unidecode",
    "wavenet-vocoder",
]

[project.scripts]
experiment = "phd:main"
check = "phd:check"
scratch = "phd:scratch"
lld_classify = "phd:lld_classify"
spect_classify = "phd:spect_classify"

[build-system]
requires = [ "setuptools" ]

[tool.uv]
managed = true
default-groups = "all"
cache-keys = [
    { file = "pyproject.toml" },
]
compile-bytecode = true
prerelease = "allow"
conflicts = [
    [
        { extra = "rocm" },
        { extra = "cuda" },
        { extra = "cpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/nightly/rocm6.4"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[[tool.uv.index]]
name = "tensorflow-rocm"
url = "https://repo.radeon.com/rocm/manylinux/rocm-rel-6.4.2"
explicit = true

[tool.mypy]
color_output = true
explicit_package_bases = true
force_uppercase_builtins = true
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_context = true
exclude = [
    "^src/phd/models/.*",
    "^src/phd/experiments/.*",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "type-checking"},
]
lint = [
    "pyls-memestra",
    "pylsp-mypy",
    "pylsp-rope",
    "python-lsp-black",
    "python-lsp-isort",
    "python-lsp-ruff",
    "python-lsp-server[all]",
]
type-checking = [
    "mypy",
]

[project.optional-dependencies]

rocm = [
    "lightning",
    "lightning-utilities",
    "matplotlib",
    "mypy-extensions",
    "numpy",
    "onnxruntime-gpu",
    "pandas",
    "pillow",
    "pytorch-triton",
    "pytorch-triton-rocm",
    "pytorch-triton-xpu",
    "safetensors",
    "setuptools",
    "tensorflow-rocm",
    "tiktoken",
    "torch",
    "torchaudio",
    "torchtune",
    "torchvision",
    "tqdm",
    "typing-extensions",
    "typing-inspect",
]

cuda = [
    "lightning",
    "lightning-utilities",
    "matplotlib",
    "mypy-extensions",
    "numpy",
    "onnxruntime-gpu",
    "pandas",
    "pillow",
    "pytorch-triton",
    "pytorch-triton-rocm",
    "pytorch-triton-xpu",
    "safetensors",
    "setuptools",
    "tensorflow[and-cuda]",
    "tiktoken",
    "torch<2.8",
    "torchaudio",
    "torchtune",
    "torchvision",
    "tqdm",
    "typing-extensions",
    "typing-inspect",
]

cpu = [
    "lightning",
    "lightning-utilities",
    "matplotlib",
    "mypy-extensions",
    "numpy",
    "onnxruntime",
    "pandas",
    "pillow",
    "pytorch-triton",
    "pytorch-triton-rocm",
    "pytorch-triton-xpu",
    "safetensors",
    "setuptools",
    "tensorflow",
    "tiktoken",
    "torch",
    "torchaudio",
    "torchtune",
    "torchvision",
    "tqdm",
    "typing-extensions",
    "typing-inspect",
]


[tool.uv.sources]
disvoice = { path = "external/disvoice" }
tensorflow-rocm = [
    { url = "https://repo.radeon.com/rocm/manylinux/rocm-rel-6.4.2/tensorflow_rocm-2.17.1-cp312-cp312-manylinux_2_28_x86_64.whl", extra = "rocm" },
]

lightning-utilities = [
    { index = "pytorch-rocm", extra = "rocm"},
    { index = "pytorch-cuda", extra = "cuda"},
    { index = "pytorch-cpu",  extra = "cpu" },
]
